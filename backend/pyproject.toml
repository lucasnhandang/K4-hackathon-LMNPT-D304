[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4-student-assistant"
version = "0.1.0"
description = "Discord student assistant with FastAPI, Gemini and MongoDB"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["student_assistant*"]
